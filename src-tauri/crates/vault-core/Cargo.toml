[package]
name = "vault-core"
version = "0.1.0"
edition = "2021"
description = "像素书房的文件层：库边界、扫描、原子读写、监听、搜索、导入与草稿"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
thiserror = "2"
walkdir = "2"
notify = "8"
notify-debouncer-full = "0.7"
unicode-normalization = "0.1"
zip = { version = "2", default-features = false, features = ["deflate"] }
lofty = "0.25"

[dev-dependencies]
tempfile = "3"
